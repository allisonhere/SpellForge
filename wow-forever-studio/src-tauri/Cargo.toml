[package]
name = "wow-forever-studio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline-first IDE for World of Warcraft: Forever addons"

[lib]
name = "wfs_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
full_moon = "1"
directories = "5"
thiserror = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
